name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome CI
        run: pnpm exec biome ci

  # Unit tests, then the app's parts on screen in WebKit — the engine the
  # macOS app renders with — so a layout or selection regression fails here
  # instead of in someone's hands.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm --filter @latex4all/desktop test

      - name: Install WebKit
        run: pnpm --filter @latex4all/desktop exec playwright install --with-deps webkit

      - name: End-to-end tests (WebKit)
        run: pnpm --filter @latex4all/desktop test:e2e

      - name: Keep the report when they fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/desktop/playwright-report
          retention-days: 7

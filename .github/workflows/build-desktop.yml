          APP_PATH="$BUNDLE/macos/Latex4All.app"

          if [ -z "$DMG_PATH" ]; then
            echo "Error: DMG not found"
            exit 1
          fi

          echo "==> Notarizing $DMG_PATH ..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait --timeout 30m

          echo "==> Stapling..."
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler staple "$APP_PATH"

      - name: Collect updater artifacts
        id: collect
        run: |
          BUNDLE="apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle"
          TAR_SIG=$(find "$BUNDLE/macos" -name '*.app.tar.gz.sig' 2>/dev/null | head -1)
          TAR_GZ=$(find "$BUNDLE/macos" -name '*.app.tar.gz' ! -name '*.sig' 2>/dev/null | head -1)

          if [ -n "$TAR_SIG" ] && [ -n "$TAR_GZ" ]; then
            echo "sig=$(cat "$TAR_SIG")" >> $GITHUB_OUTPUT
            echo "url=$(basename "$TAR_GZ")" >> $GITHUB_OUTPUT
          else
            echo "::warning::No updater signature for macOS — this platform will be missing from the update manifest."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-intel
          path: |
            apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.sig
          if-no-files-found: warn

    outputs:
      sig: ${{ steps.collect.outputs.sig }}
      url: ${{ steps.collect.outputs.url }}

  # ──────────────────────────────────────────────
  # Linux
  # ──────────────────────────────────────────────
  # DEPRECATED (2026-09-06): Linux is no longer a released target. The job no
  # longer runs on release tags or on a "all" dispatch, so `publish` sees no
  # Linux signature and drops linux-x86_64 from latest.json and the release
  # assets. Kept buildable behind an explicit `platforms: linux` dispatch so the
  # target can be revived without reconstructing this job.
  build-linux:
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.platforms == 'linux'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            autoconf autoconf-archive automake libtool pkg-config \
            libgraphite2-dev libicu-dev libfontconfig1-dev libharfbuzz-dev \
            libssl-dev libfreetype-dev libpng-dev zlib1g-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      # The WordNet database backing the dictionary/thesaurus is ~27 MB and
      # isn't committed; tauri.conf.json bundles it as a resource.
      - name: Fetch WordNet database
        run: node scripts/fetch-wordnet.mjs

      - name: Build Tauri app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZOTERO_CONSUMER_KEY: ${{ secrets.ZOTERO_CONSUMER_KEY }}
          ZOTERO_CONSUMER_SECRET: ${{ secrets.ZOTERO_CONSUMER_SECRET }}
          # Use pkg-config (same as tectonic's own CI) with semi-static linking.
          # AppImage bundles .so files automatically for portable distribution.
          TECTONIC_DEP_BACKEND: pkg-config
          TECTONIC_PKGCONFIG_FORCE_SEMI_STATIC: "true"
          CXXFLAGS: "-std=c++17"
          CFLAGS: ""
        run: |
          # Updater artifacts are signed; without a key, build the installer
          # alone rather than failing the whole job.
          EXTRA=""
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            EXTRA="--config src-tauri/tauri.local-build.conf.json"
          fi
          pnpm --filter @latex4all/desktop tauri build $EXTRA --target x86_64-unknown-linux-gnu

      - name: Collect updater artifacts
        id: collect
        run: |
          BUNDLE="apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          APPIMAGE_SIG=$(find "$BUNDLE/appimage" -name '*.AppImage.sig' 2>/dev/null | head -1)
          APPIMAGE=$(find "$BUNDLE/appimage" -name '*.AppImage' ! -name '*.sig' 2>/dev/null | head -1)

          if [ -n "$APPIMAGE_SIG" ] && [ -n "$APPIMAGE" ]; then
            echo "sig=$(cat "$APPIMAGE_SIG")" >> $GITHUB_OUTPUT
            echo "url=$(basename "$APPIMAGE")" >> $GITHUB_OUTPUT
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.sig
          if-no-files-found: warn

    outputs:
      sig: ${{ steps.collect.outputs.sig }}
      url: ${{ steps.collect.outputs.url }}

  # ──────────────────────────────────────────────
  # Publish: generate latest.json & upload to release
  # ──────────────────────────────────────────────
  publish:
    needs: [build-windows, build-macos, build-macos-intel, build-linux]
    runs-on: ubuntu-latest
    if: >-
      always()
      && (
        startsWith(github.ref, 'refs/tags/v')
        || inputs.release_tag != ''
        || github.ref == 'refs/heads/testing'
      )

    steps:
      - uses: actions/checkout@v4

      - name: Determine tag and channel
        id: tag
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/testing" ]]; then
            # Rolling tag: every testing build overwrites the same prerelease,
            # so latest-test.json lives at a URL that never changes. Named
            # distinctly from the `testing` *branch* — a tag and branch sharing
            # a name makes every bare `testing` ref ambiguous to git.
            echo "tag=testing-latest" >> $GITHUB_OUTPUT
            echo "channel=test" >> $GITHUB_OUTPUT
            echo "manifest=latest-test.json" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "channel=release" >> $GITHUB_OUTPUT
            echo "manifest=latest.json" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "channel=release" >> $GITHUB_OUTPUT
            echo "manifest=latest.json" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate update manifest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MANIFEST: ${{ steps.tag.outputs.manifest }}
          WIN_SIG: ${{ needs.build-windows.outputs.sig }}
          WIN_URL: ${{ needs.build-windows.outputs.url }}
          MAC_SIG: ${{ needs.build-macos.outputs.sig }}
          MAC_URL: ${{ needs.build-macos.outputs.url }}
          MAC_INTEL_SIG: ${{ needs.build-macos-intel.outputs.sig }}
          MAC_INTEL_URL: ${{ needs.build-macos-intel.outputs.url }}
          LIN_SIG: ${{ needs.build-linux.outputs.sig }}
          LIN_URL: ${{ needs.build-linux.outputs.url }}
        run: |
          # The release channel takes its version from the tag. The test
          # channel has no meaningful tag (it is always "testing"), so it
          # re-runs the very script the build jobs used; sharing the one
          # implementation is what keeps the manifest and the binaries from
          # claiming different versions.
          if [ "${{ steps.tag.outputs.channel }}" = "test" ]; then
            node scripts/stamp-test-version.mjs
            # Read back the file the script just wrote rather than $TEST_VERSION:
            # values written to $GITHUB_ENV only land in *later* steps.
            VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          else
            VERSION="${TAG#v}"
          fi
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"

          node -e "
            const BASE = process.env.BASE_URL;
            const platforms = {};
            if (process.env.MAC_SIG)
              platforms['darwin-aarch64'] = { signature: process.env.MAC_SIG, url: BASE + '/Latex4All-macOS.app.tar.gz' };
            if (process.env.MAC_INTEL_SIG)
              platforms['darwin-x86_64'] = { signature: process.env.MAC_INTEL_SIG, url: BASE + '/Latex4All-macOS-Intel.app.tar.gz' };
            if (process.env.LIN_SIG)
              platforms['linux-x86_64'] = { signature: process.env.LIN_SIG, url: BASE + '/Latex4All-Linux.AppImage' };
            if (process.env.WIN_SIG)
              platforms['windows-x86_64'] = { signature: process.env.WIN_SIG, url: BASE + '/Latex4All-Windows-setup.exe' };

            const data = {
              version: '$VERSION',
              notes: 'Latex4All $TAG',
              pub_date: '$PUB_DATE',
              platforms
            };
            require('fs').writeFileSync(process.env.MANIFEST, JSON.stringify(data, null, 2));
            console.log(JSON.stringify(data, null, 2));
          "

      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "${{ steps.tag.outputs.channel }}" = "test" ]; then
            # Must be a *published* prerelease, not a draft: assets on a draft
            # release are not reachable by the stable download URL the updater
            # polls. Prerelease keeps it out of `releases/latest`, which is what
            # the release channel follows, so test builds stay invisible there.
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release edit "$TAG" --prerelease --latest=false \
                --title "Latex4All (test channel)" \
                --notes "Rolling build from the testing branch — run ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}."
            else
              gh release create "$TAG" --prerelease --latest=false \
                --title "Latex4All (test channel)" \
                --notes "Rolling build from the testing branch — run ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}."
            fi
          else
            gh release view "$TAG" > /dev/null 2>&1 || \
              gh release create "$TAG" --title "Latex4All $TAG" --generate-notes --draft
          fi

      - name: Rename and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p upload

          # Rename platform artifacts to version-free names
          # macOS Apple Silicon (from desktop-macos artifact)
          find artifacts/desktop-macos -name "*.dmg" 2>/dev/null | head -1 | xargs -I{} cp {} upload/Latex4All-macOS.dmg
          find artifacts/desktop-macos -name "*.app.tar.gz" 2>/dev/null | head -1 | xargs -I{} cp {} upload/Latex4All-macOS.app.tar.gz
          # macOS Intel (from desktop-macos-intel artifact)
          find artifacts/desktop-macos-intel -name "*.dmg" 2>/dev/null | head -1 | xargs -I{} cp {} upload/Latex4All-macOS-Intel.dmg
          find artifacts/desktop-macos-intel -name "*.app.tar.gz" 2>/dev/null | head -1 | xargs -I{} cp {} upload/Latex4All-macOS-Intel.app.tar.gz
          # Windows
          find artifacts/desktop-windows -name "*-setup.exe" 2>/dev/null | head -1 | xargs -I{} cp {} upload/Latex4All-Windows-setup.exe
          find artifacts/desktop-windows -name "*.msi" 2>/dev/null | head -1 | xargs -I{} cp {} upload/Latex4All-Windows.msi
          # Linux
          find artifacts/desktop-linux -name "*.deb" 2>/dev/null | head -1 | xargs -I{} cp {} upload/Latex4All-Linux.deb
          find artifacts/desktop-linux -name "*.rpm" 2>/dev/null | head -1 | xargs -I{} cp {} upload/Latex4All-Linux.rpm
          find artifacts/desktop-linux -name "*.AppImage" 2>/dev/null | head -1 | xargs -I{} cp {} upload/Latex4All-Linux.AppImage

          cp "${{ steps.tag.outputs.manifest }}" upload/

          echo "==> Uploading:"
          ls -la upload/

          for file in upload/*; do
            gh release upload "$TAG" "$file" --clobber
          done

      # Release stays as draft — publish manually from GitHub Releases UI

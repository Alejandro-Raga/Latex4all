name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upload to this release tag (e.g. v1.0.0). Leave empty for artifact-only build."
        required: false
        default: ""
      platforms:
        description: "Which platforms to build ('all' excludes Linux — deprecated)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
  push:
    tags:
      - "v*"
    branches:
      # Test channel: every push here is published to the rolling `testing`
      # prerelease that latest-test.json points at.
      - testing

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  # ──────────────────────────────────────────────
  # Windows
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.platforms == 'all'
      || inputs.platforms == 'windows'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set vcpkg path
        shell: bash
        run: echo "VCPKG_INSTALLED=$VCPKG_INSTALLATION_ROOT/installed" >> $GITHUB_ENV

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_INSTALLED }}
          key: vcpkg-win-v2

      - name: Install Windows dependencies (vcpkg)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: "clear"
        run: |
          vcpkg install "harfbuzz[graphite2]:x64-windows-static-release" \
            fontconfig:x64-windows-static-release \
            freetype:x64-windows-static-release \
            icu:x64-windows-static-release

      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_INSTALLED }}
          key: vcpkg-win-v2

      - name: Set Windows build environment
        shell: bash
        run: |
          echo "TECTONIC_DEP_BACKEND=vcpkg" >> $GITHUB_ENV
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV
          echo "VCPKGRS_TRIPLET=x64-windows-static-release" >> $GITHUB_ENV
          echo "VCPKG_DEFAULT_HOST_TRIPLET=x64-windows-static-release" >> $GITHUB_ENV
          echo "RUSTFLAGS=-Ctarget-feature=+crt-static" >> $GITHUB_ENV
          echo "CXXFLAGS=/std:c++17" >> $GITHUB_ENV
          echo "CFLAGS=" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      # The WordNet database backing the dictionary/thesaurus is ~27 MB and
      # isn't committed; tauri.conf.json bundles it as a resource.
      - name: Fetch WordNet database
        run: node scripts/fetch-wordnet.mjs

      # Test-channel builds must climb in version or the updater has nothing
      # newer to offer. See scripts/stamp-test-version.mjs.
      - name: Stamp test-channel version
        if: github.ref == 'refs/heads/testing'
        shell: bash
        run: node scripts/stamp-test-version.mjs

      - name: Build Tauri app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZOTERO_CONSUMER_KEY: ${{ secrets.ZOTERO_CONSUMER_KEY }}
          ZOTERO_CONSUMER_SECRET: ${{ secrets.ZOTERO_CONSUMER_SECRET }}
        run: |
          # Updater artifacts are signed; without a key, build the installer
          # alone rather than failing the whole job.
          EXTRA=""
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            EXTRA="--config src-tauri/tauri.local-build.conf.json"
          fi
          pnpm --filter @latex4all/desktop tauri build $EXTRA --target x86_64-pc-windows-msvc

      - name: Collect updater artifacts
        id: collect
        shell: bash
        run: |
          BUNDLE="apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          NSIS_SIG=$(find "$BUNDLE/nsis" -name '*-setup.exe.sig' 2>/dev/null | head -1)
          NSIS_EXE=$(find "$BUNDLE/nsis" -name '*-setup.exe' ! -name '*.sig' 2>/dev/null | head -1)

          if [ -n "$NSIS_SIG" ] && [ -n "$NSIS_EXE" ]; then
            echo "sig=$(cat "$NSIS_SIG")" >> $GITHUB_OUTPUT
            echo "url=$(basename "$NSIS_EXE")" >> $GITHUB_OUTPUT
          else
            # Without this the manifest silently ships {"platforms": {}} and the
            # updater offers nothing, with no failed step to point at.
            echo "::warning::No updater signature for Windows — this platform will be missing from the update manifest."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.sig
          if-no-files-found: warn

    outputs:
      sig: ${{ steps.collect.outputs.sig }}
      url: ${{ steps.collect.outputs.url }}

  # ──────────────────────────────────────────────
  # macOS (Apple Silicon)
  # ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-14
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.platforms == 'all'
      || inputs.platforms == 'macos'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build tools required by vcpkg ports (autotools for gperf, fontconfig, etc.)
      # These are compile-time only — they do NOT create runtime dylib dependencies.
      - name: Install build tools
        run: brew install autoconf autoconf-archive automake libtool pkg-config

      # Static linking via vcpkg — avoids runtime dependency on Homebrew dylibs.
      # Ref: https://tectonic-typesetting.github.io/book/latest/howto/build-tectonic/
      # Ref: https://learn.microsoft.com/en-us/vcpkg/users/triplets (arm64-osx defaults to static)
      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg $HOME/vcpkg
          $HOME/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/vcpkg/installed
          key: vcpkg-macos-arm64-v1

      - name: Install macOS dependencies (vcpkg)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        env:
          VCPKG_BINARY_SOURCES: "clear"
        run: |
          $HOME/vcpkg/vcpkg install \
            "harfbuzz[graphite2]:arm64-osx" \
            fontconfig:arm64-osx \
            freetype:arm64-osx \
            icu:arm64-osx

      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/vcpkg/installed
          key: vcpkg-macos-arm64-v1

      - name: Set macOS build environment
        run: |
          echo "TECTONIC_DEP_BACKEND=vcpkg" >> $GITHUB_ENV
          echo "CXXFLAGS=-std=c++17" >> $GITHUB_ENV
          echo "CFLAGS=" >> $GITHUB_ENV

      # This fork has no Apple Developer account. Upstream's macOS jobs imported
      # a certificate unconditionally, which fails on an empty secret with
      # "SecKeychainItemImport: One or more parameters passed to a function were
      # not valid" — the whole job dies before it ever compiles anything.
      # Detect the credentials once and skip signing/notarisation without them.
      # The DMG is then unsigned (Gatekeeper will quarantine it), but it builds,
      # and the *updater* signature is unaffected: that comes from
      # TAURI_SIGNING_PRIVATE_KEY, which has nothing to do with Apple signing.
      - name: Detect Apple signing credentials
        id: apple_creds
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No APPLE_CERTIFICATE secret set — building an unsigned macOS bundle."
          fi

      - name: Import Apple certificate
        if: steps.apple_creds.outputs.available == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      # The WordNet database backing the dictionary/thesaurus is ~27 MB and
      # isn't committed; tauri.conf.json bundles it as a resource.
      - name: Fetch WordNet database
        run: node scripts/fetch-wordnet.mjs

      # Test-channel builds must climb in version or the updater has nothing
      # newer to offer. See scripts/stamp-test-version.mjs.
      - name: Stamp test-channel version
        if: github.ref == 'refs/heads/testing'
        shell: bash
        run: node scripts/stamp-test-version.mjs

      - name: Build Tauri app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZOTERO_CONSUMER_KEY: ${{ secrets.ZOTERO_CONSUMER_KEY }}
          ZOTERO_CONSUMER_SECRET: ${{ secrets.ZOTERO_CONSUMER_SECRET }}
          # Deliberately NOT named APPLE_SIGNING_IDENTITY: an unset secret still
          # arrives as an empty string, and the bundler reads Some("") as a real
          # identity — it builds a keychain for "" and codesign dies with "The
          # specified item could not be found in the keychain". Re-exported
          # below only when it actually holds something.
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Updater artifacts are signed; without a key, build the installer
          # alone rather than failing the whole job.
          EXTRA=""
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            EXTRA="--config src-tauri/tauri.local-build.conf.json"
          fi
          # Leaving the variable unset makes the bundler's keychain() return
          # None, which skips Apple code signing silently and still emits the
          # updater .sig. --no-sign is NOT the way to do this: it also skips
          # updater signing ("Updater signing is skipped due to --no-sign
          # flag"), which drops macOS from the update manifest entirely.
          if [ -n "${APPLE_SIGNING_IDENTITY_SECRET:-}" ]; then
            export APPLE_SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY_SECRET"
          fi
          pnpm --filter @latex4all/desktop tauri build $EXTRA --target aarch64-apple-darwin

      - name: Notarize DMG
        if: steps.apple_creds.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          TARGET="aarch64-apple-darwin"
          BUNDLE="apps/desktop/src-tauri/target/$TARGET/release/bundle"
          DMG_PATH=$(find "$BUNDLE/dmg" -name '*.dmg' | head -1)
          APP_PATH="$BUNDLE/macos/Latex4All.app"

          if [ -z "$DMG_PATH" ]; then
            echo "Error: DMG not found"
            exit 1
          fi

          echo "==> Notarizing $DMG_PATH ..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait --timeout 30m

          echo "==> Stapling..."
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler staple "$APP_PATH"

      - name: Collect updater artifacts
        id: collect
        run: |
          BUNDLE="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          TAR_SIG=$(find "$BUNDLE/macos" -name '*.app.tar.gz.sig' 2>/dev/null | head -1)
          TAR_GZ=$(find "$BUNDLE/macos" -name '*.app.tar.gz' ! -name '*.sig' 2>/dev/null | head -1)

          if [ -n "$TAR_SIG" ] && [ -n "$TAR_GZ" ]; then
            echo "sig=$(cat "$TAR_SIG")" >> $GITHUB_OUTPUT
            echo "url=$(basename "$TAR_GZ")" >> $GITHUB_OUTPUT
          else
            echo "::warning::No updater signature for macOS — this platform will be missing from the update manifest."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.sig
          if-no-files-found: warn

    outputs:
      sig: ${{ steps.collect.outputs.sig }}
      url: ${{ steps.collect.outputs.url }}

  # ──────────────────────────────────────────────
  # macOS (Intel x86_64)
  # Ref: https://github.com/actions/runner-images/issues/13045
  #      macos-13 retired 2025-12-04, macos-15-intel is the replacement
  #      Intel runners available until Fall 2027
  # Ref: https://v2.tauri.app/distribute/pipelines/github/
  # Ref: https://v2.tauri.app/plugin/updater/ (platform key: darwin-x86_64)
  # ──────────────────────────────────────────────
  build-macos-intel:
    runs-on: macos-15-intel
    # Excluded from test-channel builds: the Intel runner is the slowest in the
    # matrix and there is no Intel tester to serve.
    if: >-
      github.ref != 'refs/heads/testing'
      && (
        github.event_name != 'workflow_dispatch'
        || inputs.platforms == 'all'
        || inputs.platforms == 'macos'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build tools required by vcpkg ports (autotools for gperf, fontconfig, etc.)
      - name: Install build tools
        run: brew install autoconf autoconf-archive automake libtool pkg-config

      # Static linking via vcpkg — same approach as Apple Silicon and Windows.
      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg $HOME/vcpkg
          $HOME/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/vcpkg/installed
          key: vcpkg-macos-x64-v1

      - name: Install macOS dependencies (vcpkg)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        env:
          VCPKG_BINARY_SOURCES: "clear"
        run: |
          $HOME/vcpkg/vcpkg install \
            "harfbuzz[graphite2]:x64-osx" \
            fontconfig:x64-osx \
            freetype:x64-osx \
            icu:x64-osx

      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/vcpkg/installed
          key: vcpkg-macos-x64-v1

      - name: Set macOS build environment
        run: |
          echo "TECTONIC_DEP_BACKEND=vcpkg" >> $GITHUB_ENV
          echo "CXXFLAGS=-std=c++17" >> $GITHUB_ENV
          echo "CFLAGS=" >> $GITHUB_ENV

      # This fork has no Apple Developer account. Upstream's macOS jobs imported
      # a certificate unconditionally, which fails on an empty secret with
      # "SecKeychainItemImport: One or more parameters passed to a function were
      # not valid" — the whole job dies before it ever compiles anything.
      # Detect the credentials once and skip signing/notarisation without them.
      # The DMG is then unsigned (Gatekeeper will quarantine it), but it builds,
      # and the *updater* signature is unaffected: that comes from
      # TAURI_SIGNING_PRIVATE_KEY, which has nothing to do with Apple signing.
      - name: Detect Apple signing credentials
        id: apple_creds
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No APPLE_CERTIFICATE secret set — building an unsigned macOS bundle."
          fi

      - name: Import Apple certificate
        if: steps.apple_creds.outputs.available == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      # The WordNet database backing the dictionary/thesaurus is ~27 MB and
      # isn't committed; tauri.conf.json bundles it as a resource.
      - name: Fetch WordNet database
        run: node scripts/fetch-wordnet.mjs

      - name: Build Tauri app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZOTERO_CONSUMER_KEY: ${{ secrets.ZOTERO_CONSUMER_KEY }}
          ZOTERO_CONSUMER_SECRET: ${{ secrets.ZOTERO_CONSUMER_SECRET }}
          # Deliberately NOT named APPLE_SIGNING_IDENTITY: an unset secret still
          # arrives as an empty string, and the bundler reads Some("") as a real
          # identity — it builds a keychain for "" and codesign dies with "The
          # specified item could not be found in the keychain". Re-exported
          # below only when it actually holds something.
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Updater artifacts are signed; without a key, build the installer
          # alone rather than failing the whole job.
          EXTRA=""
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            EXTRA="--config src-tauri/tauri.local-build.conf.json"
          fi
          # Leaving the variable unset makes the bundler's keychain() return
          # None, which skips Apple code signing silently and still emits the
          # updater .sig. --no-sign is NOT the way to do this: it also skips
          # updater signing ("Updater signing is skipped due to --no-sign
          # flag"), which drops macOS from the update manifest entirely.
          if [ -n "${APPLE_SIGNING_IDENTITY_SECRET:-}" ]; then
            export APPLE_SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY_SECRET"
          fi
          pnpm --filter @latex4all/desktop tauri build $EXTRA --target x86_64-apple-darwin

      - name: Notarize DMG
        if: steps.apple_creds.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          TARGET="x86_64-apple-darwin"
          BUNDLE="apps/desktop/src-tauri/target/$TARGET/release/bundle"

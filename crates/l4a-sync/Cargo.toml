[package]
name = "l4a-sync"
version = "0.1.0"
edition = "2021"
description = "Latex4All's sync between copies of the app: no accounts, no central server."
license = "MIT"

[dependencies]
iroh = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
curve25519-dalek = "5"
chacha20poly1305 = "0.10"
hkdf = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

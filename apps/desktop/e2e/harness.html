<!doctype html>
<html class="h-full">
  <head><meta charset="UTF-8" /><title>Latex4All e2e</title></head>
  <body class="h-full">
    <div id="root" style="height: 100vh"></div>
    <script>
      // Tauri, stubbed before any module loads (no native side here). The
      // workspace page answers native calls with nothing; the others refuse.
      const workspace = location.search.includes("scenario=workspace");
      let callbacks = 0;
      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { windowLabel: "main", label: "main" },
        },
        invoke: async (cmd, args) => {
          // The bug report window: its system details, and the report sent
          // kept for the test to read.
          if (location.search.includes("scenario=bug")) {
            if (cmd === "get_system_info") {
              return { os: "macos", os_version: "15", arch: "aarch64", app_version: "1.2.120" };
            }
            if (cmd === "send_bug_report") {
              window.__sentReport = args.report;
              return "2026-10-04_10-00-00_abc123";
            }
            if (cmd.startsWith("plugin:event")) return 0;
            return null;
          }
          // The projects page: folders that exist (but one), edited at
          // different times, nothing to preview.
          if (location.search.includes("scenario=projects")) {
            if (cmd.startsWith("plugin:event")) return 0;
            if (cmd === "plugin:app|version") return "3.0.0";
            if (cmd === "plugin:fs|exists") {
              return !String(args?.path ?? "").includes("Old thesis");
            }
            if (cmd === "plugin:fs|stat") {
              const path = String(args?.path ?? "");
              const hours = path.includes("talk") ? 2 : path.includes("Paper") ? 30 : 200;
              const at = Date.now() - hours * 3_600_000;
              return { mtime: at, birthtime: at - 86_400_000 * 40, isFile: false, isDirectory: true };
            }
            if (cmd === "plugin:fs|read_dir") return [];
            if (cmd === "plugin:fs|read_text_file") {
              const path = String(args?.path ?? "");
              const type = path.includes("talk") ? "Presentation"
                : path.includes("Paper") ? "Article"
                : path.includes("thesis") ? "Thesis" : null;
              if (!path.endsWith("project.json") || !type) throw new Error("no file");
              return Array.from(new TextEncoder().encode(JSON.stringify({ type })));
            }
            if (cmd === "collab_load_doc") return null;
            if (/^(list|check|detect)/.test(cmd)) return [];
            throw new Error("no native side in tests");
          }
          if (workspace) {
            if (cmd.startsWith("plugin:event")) return 0;
            return /^(list|check|get_spelling|detect|history_list|slash)/.test(cmd)
              ? []
              : null;
          }
          throw new Error("no native side in tests");
        },
        transformCallback: () => ++callbacks,
        convertFileSrc: (p) => p,
      };
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener() {} };
    </script>
    <script type="module" src="./harness.tsx"></script>
  </body>
</html>

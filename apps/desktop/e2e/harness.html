<!doctype html>
<html class="h-full">
  <head><meta charset="UTF-8" /><title>Latex4All e2e</title></head>
  <body class="h-full">
    <div id="root" style="height: 100vh"></div>
    <script>
      // Tauri, stubbed before any module loads (no native side here). The
      // workspace page answers native calls with nothing; the others refuse.
      const workspace = location.search.includes("scenario=workspace");
      let callbacks = 0;
      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { windowLabel: "main", label: "main" },
        },
        invoke: async (cmd) => {
          if (workspace) {
            if (cmd.startsWith("plugin:event")) return 0;
            return /^(list|check|get_spelling|detect|history_list|slash)/.test(cmd)
              ? []
              : null;
          }
          throw new Error("no native side in tests");
        },
        transformCallback: () => ++callbacks,
        convertFileSrc: (p) => p,
      };
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener() {} };
    </script>
    <script type="module" src="./harness.tsx"></script>
  </body>
</html>

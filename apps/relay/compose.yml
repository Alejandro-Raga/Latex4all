# The relay is reachable by anyone on the internet, so the container gets as
# little as possible: no root, nothing writable but its own data folder, no
# capabilities, no access to the host's other files or Docker, and a ceiling on
# what it can consume. Storage itself is capped by the relay (DEFAULT_LIMITS).
services:
  relay:
    build: .
    image: latex4all-relay
    restart: unless-stopped
    ports:
      # Loopback only; cloudflared publishes it.
      - "127.0.0.1:8082:8082"
    user: node
    environment:
      # Set in .env next to this file; see the README.
      MIN_PROTOCOL: ${MIN_PROTOCOL:-1}
    read_only: true
    volumes:
      # Owned by uid 1000, which is both `usr` on the vm and `node` in here.
      - ./data:/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
